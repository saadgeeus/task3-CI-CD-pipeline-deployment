name: Django Todo CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: saadgeeus/django-todo

jobs:

  quality-check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build CI Docker image
        run: |
          docker build -t django-todo:ci .

      - name: Run Ruff lint
        run: |
          docker run --rm django-todo:ci ruff check .

      - name: Run Django unit tests
        run: |
          docker run --rm django-todo:ci python manage.py test

  docker-build-push:
    name: Build & Push Docker Image
    needs: quality-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        run: |
          VERSION=$(cat VERSION)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push versioned image
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}

      - name: Push latest image
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:latest

      - name: Create Git version tag
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "Git tag $VERSION already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Deployment output summary
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          IMAGE="${{ env.IMAGE_NAME }}:$VERSION"

          {
            echo "## 🚀 CI/CD Deployment Summary"
            echo ""
            echo "| Metric | Result |"
            echo "|---|---|"
            echo "| Branch | \`main\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Docker Image | \`$IMAGE\` |"
            echo "| Latest Tag | \`${{ env.IMAGE_NAME }}:latest\` |"
            echo "| Lint | ✅ Passed |"
            echo "| Unit Tests | ✅ Passed |"
            echo "| Docker Build | ✅ Passed |"
            echo "| DockerHub Push | ✅ Passed |"
            echo "| Git Version Tag | ✅ $VERSION |"
          } >> "$GITHUB_STEP_SUMMARY"
